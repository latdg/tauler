name: Prova FCF (temporal)
on: workflow_dispatch
jobs:
  prova:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for g in 58161891 58161893 58162320; do
            c=$(curl -s -o /tmp/r.json -w "%{http_code}" -A "Mozilla/5.0" "https://www.fcf.cat/api/competition/classificacio?grupId=$g")
            echo "::notice::grup $g -> HTTP $c, $(wc -c </tmp/r.json) bytes, $(head -c 60 /tmp/r.json | tr -d '\n')"
          done
