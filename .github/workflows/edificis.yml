# Edat dels edificis — La TdG · 27.10.2026
# Edificis del Cadastre dels quatre municipis (dades/edificis.json i
# dades/edificis/*.geojson). Un cop al mes; també es pot llançar a mà.
name: Edat dels edificis

on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edificis
  cancel-in-progress: false

jobs:
  edificis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pyproj
      - name: Genera i desa
        run: |
          python edificis/edificis.py 2>&1 | tee edificis/registre.txt
          git config user.name "La TdG (edificis)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 27.10.2026: si un altre procés ha pujat canvis alhora, es torna a provar; si no hi ha manera, el workflow falla (no es perd en silenci).
          git add edificis/registre.txt; git add dades/edificis.json dades/edificis 2>/dev/null || true
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Edat dels edificis ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 10))
            git fetch -q origin main && git rebase -q origin/main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
