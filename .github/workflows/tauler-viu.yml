# Tauler «La TdG ampliada» en directe — 21.10.2026
# Cada 15 minuts calcula els blocs vius i els fusiona amb el que publica
# l'Apps Script. L'horari de GitHub no arriba (o arriba amb hores de retard):
# el workflow fa un bucle de 5 h 30 min i es torna a llançar ell mateix.
# L'horari queda com a reserva per reprendre la cadena si s'atura.

name: Tauler en directe

on:
  schedule:
    - cron: "41 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: tauler-viu
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instal·la dependències
        run: pip install requests

      - name: Bucle (cada 15 minuts, 5 h 30 min)
        run: |
          git config user.name "La TdG (tauler)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FI=$((SECONDS + 19800))
          while :; do
            git fetch -q origin main && git reset -q --hard origin/main
            python viu/tauler_viu.py calcula || true
            for intent in 1 2 3; do
              git fetch -q origin main
              git reset -q --hard origin/main
              python viu/tauler_viu.py fusiona
              python esports/esports.py || true      # esports (24.10.2026)
              git add dades
              if git diff --cached --quiet; then echo "Sense canvis"; break; fi
              git commit -qm "Tauler en directe ($(TZ=Europe/Madrid date '+%d.%m.%Y %H.%M'))"
              git push -q origin HEAD:main && break
              sleep 10
            done
            ara=$(date +%s); espera=$(( 900 - (ara % 900) + 420 ))   # als minuts 7, 22, 37 i 52
            [ $espera -gt 900 ] && espera=$((espera - 900))
            [ $((SECONDS + espera + 120)) -ge $FI ] && break
            sleep $espera
          done

      - name: Tornar-se a llançar
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run tauler-viu.yml -R "${{ github.repository }}"
