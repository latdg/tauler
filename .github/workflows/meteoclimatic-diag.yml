name: Meteoclimàtic (diagnòstic)
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python viu/meteoclimatic_diag.py
      - run: |
          git config user.name "La TdG (tauler)"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dades/pluja/diag.txt; git commit -qm "Meteoclimàtic: diagnòstic" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
