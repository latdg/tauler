# Logotips de les benzineres — La TdG · 15.11.2026
# Baixa les icones de les marques que falten a carburants/logos/.
# Corre quan es toca l'script, un cop al mes per si hi ha marques noves, i a mà.
name: Logos de benzineres

on:
  push:
    branches: [main]
    paths:
      - "carburants/logos.py"
      - ".github/workflows/logos-benzineres.yml"
  schedule:
    - cron: "41 4 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logos-benzineres
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Baixa i desa
        run: |
          python carburants/logos.py
          git config user.name "La TdG (logos)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add carburants/logos
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Logos de benzineres ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 5))
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
