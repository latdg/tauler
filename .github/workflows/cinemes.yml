# Cinemes — La TdG · 01.11.2026
# La cartellera dels cinemes de la zona (cinemes/cinemes.py): desa dades/cinemes.json.
# Cada 3 hores; també es pot llançar a mà. El token de TMDB és el secret TMDB_TOKEN i
# només el veu el pas que genera les dades. Sense secret, surt sense valoracions ni plataformes.
# Els canvis es desen a la branca on corre: mentre és a la branca cinemes, no toca main.
name: Cinemes

on:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [cinemes]
    paths:
      - "cinemes/cinemes.py"
      - ".github/workflows/cinemes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cinemes
  cancel-in-progress: false

jobs:
  cinemes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Genera
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python cinemes/cinemes.py
      - name: Desa
        run: |
          git config user.name "La TdG (cinemes)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dades/cinemes.json dades/cinemes cinemes/tmdb.json cinemes/traduccions.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Cinemes ($(TZ=Europe/Madrid date '+%d.%m.%Y %H.%M'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((intent * 10))
            git pull -q --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
