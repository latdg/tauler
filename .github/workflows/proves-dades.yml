# Temporal (07.11.2026): comprovacions dels blocs nous en un navegador. S'esborrarà.
name: Proves de dades
on:
  push:
    branches: [proves-dades]
permissions:
  contents: write
jobs:
  proves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: radar, path: web }
      - uses: actions/checkout@v4
        with: { path: proves }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q requests playwright && python -m playwright install --with-deps chromium > /dev/null
      - run: python proves/navegador.py
      - name: Desa les captures a la branca
        if: always()
        run: |
          cd proves && rm -rf captures && cp -r ../captures . && git add captures &&
          git -c user.name=proves -c user.email=proves@users.noreply.github.com commit -qm "Captures" && git push -q
