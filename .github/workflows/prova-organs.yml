name: prova-organs
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in "upper(nom_organ) like '%GAVARRES%'" "upper(nom_organ) like '%CONSELL COMARCAL DEL BAIX EMPORD%'"; do
            W=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q AND data_publicacio_contracte >= '2026-01-01' OR ($q AND data_publicacio_anunci >= '2026-01-01')")
            R=$(curl -s "https://analisi.transparenciacatalunya.cat/resource/ybgg-dgi6.json?\$select=nom_organ,codi_organ,count(*)&\$where=$W&\$group=nom_organ,codi_organ")
            echo "::notice::$R"
            W2=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
            R2=$(curl -s "https://analisi.transparenciacatalunya.cat/resource/ybgg-dgi6.json?\$select=nom_organ,codi_organ,count(*)&\$where=$W2&\$group=nom_organ,codi_organ")
            echo "::notice::TOT $R2"
          done
