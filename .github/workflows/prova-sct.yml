name: prova-sct
on:
  push:
    branches: [prova-sct]
    paths: [eines/genera_comarca.py]
permissions:
  contents: write
jobs:
  comarca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: prova-sct }
      - run: pip install requests && python eines/genera_comarca.py
      - run: |
          git config user.name "latdg-bot"; git config user.email "latdg-bot@users.noreply.github.com"
          git add dades/baix_emporda.geojson; git commit -m "Límit del Baix Empordà" || true
          git push origin HEAD:prova-sct
