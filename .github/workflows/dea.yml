# Desfibril·ladors (DEA) — La TdG · 26.10.2026
# Baixa del registre del Departament de Salut els DEA dels quatre municipis i
# desa dades/dea.json. Un cop per setmana (dilluns); també es pot llançar a mà.
name: Desfibril·ladors

on:
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dea
  cancel-in-progress: false

jobs:
  dea:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Genera i desa
        run: |
          python dea/dea.py
          git config user.name "La TdG (desfibril·ladors)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 31.10.2026: abans, si el primer push fallava, el reintent veia «sense canvis» i no pujava res.
          git add dades/dea.json
          if git diff --cached --quiet; then echo "Sense canvis"; exit 0; fi
          git commit -qm "Desfibril·ladors ($(TZ=Europe/Madrid date '+%d.%m.%Y'))"
          for intent in 1 2 3 4 5 6; do
            git push -q origin HEAD:main && exit 0
            sleep $((intent * 5))
            git pull -q --rebase origin main || { git rebase --abort; exit 1; }
          done
          echo "No s'han pogut pujar els canvis"; exit 1
