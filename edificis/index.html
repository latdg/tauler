<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>Edat dels edificis · La TdG</title>
<!-- EDAT DELS EDIFICIS a pantalla completa (21.11.2026), com el radar 3D.
     El bloc és el mateix de La TdG dades (21.11.2026: el codi és allà): s'hi carrega
     ../../redaccio/dades/?incrustat&blocs=edificis&gran
     (mapa més alt), i el marc s'ajusta a l'alçada del contingut. -->
<style>
:root{--fons:#f6f5f2;--targeta:#fff;--text:#1d1d1b;--suau:#6b6b66;--linia:#e3e1db;--accent:#b4462c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fons);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:24px}
h1{margin:0;font-size:1.6rem}
.sub{color:var(--suau);margin:4px 0 12px;font-size:.9rem}
a{color:var(--accent)}
#bloc{width:100%;height:900px;border:0;display:block;background:transparent}
</style>
</head>
<body>
<header>
  <h1>🏘️ Edat dels edificis</h1>
  <p class="sub">Any de construcció de cada edifici segons el Cadastre, en 2D o en 3D, amb l'ortofoto i les xarxes de serveis del POUM com a capes. <a href="https://latdg.github.io/redaccio/dades/">Torna a La TdG dades</a></p>
</header>
<main>
    <iframe id="bloc" src="../../redaccio/dades/?incrustat&amp;blocs=edificis&amp;gran" title="Edat dels edificis"></iframe>
</main>
<script>
// El marc pren l'alçada del bloc (la pàgina és del mateix lloc, latdg.github.io).
const marc = document.getElementById("bloc");
function ajusta() {
  try {
    const d = marc.contentDocument;
    if (!d || !d.body) return;
    const h = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight);
    if (h > 200 && Math.abs(h - marc.offsetHeight) > 4) marc.style.height = h + "px";
  } catch (e) {}
}
marc.addEventListener("load", () => {
  ajusta();
  try { new ResizeObserver(ajusta).observe(marc.contentDocument.body); } catch (e) { setInterval(ajusta, 1000); }
});
</script>
</body>
</html>
