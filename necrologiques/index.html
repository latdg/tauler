<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<title>Necrològiques</title>
<!--
  NECROLÒGIQUES — La TdG ampliada · 31.10.2026
  Historial de les necrològiques recollides (dades/necrologiques.json, que omple el
  tauler en directe amb les defuncions del guió: Mémora i Diari de Girona creuats).
  De la més recent a la més antiga, 20 per pàgina, amb cercador.
  01.11.2026: cerca per camp (nom, vetlla, cerimònia, biografia) i filtres per mes i
  per municipi, que s'omplen sols amb el que hi ha a l'historial.
  02.11.2026: cerca per data de mort (un dia concret o, amb «Fins al», un interval).
-->
<style>
:root{--fons:#f6f5f2;--targeta:#fff;--text:#1d1d1b;--suau:#6b6b66;--linia:#e3e1db;--accent:#b4462c}
*{box-sizing:border-box}
body{margin:0;background:var(--fons);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:0 auto;padding:0 16px}
header{padding-top:24px}
h1{margin:0;font-size:1.6rem}
a{color:var(--accent)}
.sub{color:var(--suau);margin:4px 0 12px;font-size:.9rem}
.controls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-items:end;margin:8px 0 16px}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--linia);border-radius:8px;background:var(--targeta);color:var(--text);max-width:100%}
.controls label{display:flex;flex-direction:column;gap:2px;font-size:.8rem;color:var(--suau)}
.controls label.cerca{grid-column:1/-1}
.controls select,.controls input{width:100%}
.controls button{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--linia);border-radius:999px;background:var(--targeta);color:var(--text);cursor:pointer;justify-self:start}
section{background:var(--targeta);border:1px solid var(--linia);border-radius:12px;padding:16px;margin-bottom:16px}
.dia{margin:16px 0 8px;font-size:1rem}
.dia:first-child{margin-top:0}
.llista{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fitxa{background:var(--fons);border:1px solid var(--linia);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:.95rem;line-height:1.45}
.pagines{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:16px}
.pagines button{font:inherit;font-size:.9rem;padding:4px 12px;border:1px solid var(--linia);border-radius:999px;background:var(--targeta);color:var(--text);cursor:pointer}
.pagines button.actiu{border-color:var(--accent);color:var(--accent);font-weight:700}
.pagines button:disabled{opacity:.4;cursor:default}
.buit{color:var(--suau)}
.font{color:var(--suau);font-size:.85rem;margin:8px 0 0}
</style>
<!-- Visites (GoatCounter, sense galetes) · 01.11.2026 -->
<script data-goatcounter="https://latdg.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <h1>🕯️ Necrològiques</h1>
  <p class="sub" id="sub">Carregant…</p>
  <div class="controls">
    <label class="cerca">Text
      <input type="search" id="cerca" placeholder="Escriu per cercar…">
    </label>
    <label>Cerca a
      <select id="camp">
        <option value="tot">Tots els camps</option>
        <option value="nom">Nom</option>
        <option value="vetlla">Vetlla</option>
        <option value="ceremonia">Cerimònia</option>
        <option value="bio">Biografia</option>
      </select>
    </label>
    <label>Municipi
      <select id="municipi"><option value="">Tots</option></select>
    </label>
    <label>Mes
      <select id="mes"><option value="">Tots</option></select>
    </label>
    <label>Data de mort
      <input type="date" id="mortDe">
    </label>
    <label>Fins al (opcional)
      <input type="date" id="mortFins">
    </label>
    <button type="button" id="netejar" hidden>Treure els filtres</button>
  </div>
</header>
<main>
  <section>
    <div id="cos"><p class="buit">Carregant…</p></div>
    <div class="pagines" id="pagines"></div>
    <p class="font">Necrològiques dels cinc municipis recollides de Mémora i del Diari de Girona.
      <a href="../">Tornar a La TdG ampliada</a></p>
  </section>
</main>
<script>
const PER_PAGINA = 20;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dataCa = iso => iso ? iso.split("-").reverse().join(".") : "";
const dataNecro = t => { const m = String(t || "").match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/); return m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : ""; };
const diaNecro = x => dataNecro(x.dataMort) || dataNecro(x.dataFuneral) || x.vist || "";
const pla = s => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const DIES = ["diumenge", "dilluns", "dimarts", "dimecres", "dijous", "divendres", "dissabte"];
let TOTES = [], PAGINA = 1;
const MESOS = ["gener", "febrer", "març", "abril", "maig", "juny", "juliol", "agost", "setembre", "octubre", "novembre", "desembre"];

// Municipi de cada necrològica, deduït del text: primer on vivia, després el lloc
// de la cerimònia i, si no, qualsevol altre text (la vetlla no compta, perquè
// gairebé sempre és al tanatori de la Bisbal).
const MUNICIPIS = [
  ["La Bisbal d'Empordà", ["bisbal", "castell d'emporda"]],
  ["Corçà", ["corca", "casavells", "matajudaica", "cassa de pelras"]],
  ["Forallac", ["forallac", "vulpellac", "peratallada", "fonteta", "canapost", "fitor", "sant climent de peralta", "santa susanna de peralta"]],
  ["Cruïlles, Monells i Sant Sadurní de l'Heura", ["cruilles", "monells", "sant sadurni"]],
  ["Ullastret", ["ullastret"]]
];
const municipiDe = text => { const t = pla(text).replace(/[’‘`´]/g, "'"); const m = MUNICIPIS.find(([, nuclis]) => nuclis.some(n => t.includes(n))); return m ? m[0] : ""; };
function municipi(x) {
  const bio = [x.detall, x.biografia].join(" ");
  const viu = (bio.match(/(?:Vivia|Residia) a ([^.;]+)/i) || [])[1] || "";
  return municipiDe(viu) || municipiDe(x.ceremonia) || municipiDe(bio) || "";
}
const textCamp = (x, camp) => camp === "nom" ? x.nom : camp === "vetlla" ? x.vetlla : camp === "ceremonia" ? x.ceremonia :
  camp === "bio" ? [x.detall, x.biografia].join(" ") : [x.nom, x.detall, x.biografia, x.vetlla, x.ceremonia, x.municipi].join(" ");

function omplirFiltres() {
  const compta = (clau) => TOTES.reduce((o, x) => { const k = clau(x); if (k) o[k] = (o[k] || 0) + 1; return o; }, {});
  const mun = compta(x => x.municipi), mes = compta(x => diaNecro(x).slice(0, 7));
  const sense = TOTES.filter(x => !x.municipi).length;
  document.getElementById("municipi").innerHTML = `<option value="">Tots</option>` +
    MUNICIPIS.filter(([n]) => mun[n]).map(([n]) => `<option value="${esc(n)}">${esc(n)} (${mun[n]})</option>`).join("") +
    (sense ? `<option value="-">Sense municipi (${sense})</option>` : "");
  document.getElementById("mes").innerHTML = `<option value="">Tots</option>` +
    Object.keys(mes).sort().reverse().map(k => `<option value="${k}">${MESOS[Number(k.slice(5)) - 1].replace(/^./, c => c.toUpperCase())} ${k.slice(0, 4)} (${mes[k]})</option>`).join("");
}

const MESOS_NECRO = [["gen", "ene"], ["febr", "feb"], ["març", "marc", "mar"], ["abr"], ["maig", "may"], ["juny", "jun"],
  ["jul"], ["ag", "ago"], ["set", "sep"], ["oct"], ["nov"], ["des", "dic"]];
function dataCerimonia(x) {
  const t = String(x.ceremonia || "").toLowerCase();
  const m = t.match(/(\d{1,2})\s+(?:de\s+|d['’]\s*)?([a-zçà-ú]+)/);
  if (!m) return "";
  const mes = MESOS_NECRO.findIndex(v => v.some(p => m[2].startsWith(p))) + 1;
  const base = dataNecro(x.dataMort) || x.vist || "";
  if (!mes || !base || +m[1] < 1 || +m[1] > 31) return "";
  let any = +base.slice(0, 4);
  if (mes < +base.slice(5, 7)) any++;
  return `${any}-${String(mes).padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}
// 02.11.2026: a la cerimònia, la data en lletres («03 novembre») passa a dd.mm.aaaa, i la del
// funeral entre parèntesis només s'hi afegeix si és una altra.
// 02.11.2026: a la vetlla, les dates d'inici i final en lletres («03 de novembre») passen a dd.mm.aaaa.
function textVetlla(x) {
  const base = dataNecro(x.dataMort) || x.vist || "";
  const t = String(x.vetlla || "");
  if (!base) return esc(t);
  // La coma (o l'espai) entre la data i l'hora passa a «a les» («a la» per a la una).
  return esc(t.replace(/(\d{1,2})\s+(?:de\s+|d['’]\s*)?([a-zçà-ú]+)(\s*,?\s*(?=\d))?/gi, (m0, d, nom, sep, pos, tot) => {
    const mes = MESOS_NECRO.findIndex(v => v.some(p => nom.toLowerCase().startsWith(p))) + 1;
    if (!mes || +d < 1 || +d > 31) return m0;
    const any = +base.slice(0, 4) + (mes < +base.slice(5, 7) ? 1 : 0);
    const hora = sep === undefined ? "" : /^0?1(?!\d)/.test(tot.slice(pos + m0.length)) ? " a la " : " a les ";
    return dataCa(`${any}-${String(mes).padStart(2, "0")}-${d.padStart(2, "0")}`) + hora;
  }));
}
function textCerimonia(x) {
  const t = String(x.ceremonia || ""), iso = dataCerimonia(x), fun = dataNecro(x.dataFuneral);
  if (!iso) return esc(t) + (fun ? " (" + dataCa(fun) + ")" : "");
  // Si darrere de la data hi ha l'hora, «a les» (o «a la» per a la una).
  const net = t.replace(/(\d{1,2})\s+(?:de\s+|d['’]\s*)?[a-zçà-ú]+(\s+(?=\d))?/i, (m0, d, hora) =>
    dataCa(iso) + (hora ? (/^0?1(?!\d)/.test(t.slice(t.indexOf(m0) + m0.length)) ? " a la " : " a les ") : ""));
  return esc(net) + (fun && fun !== iso ? " (" + dataCa(fun) + ")" : "");
}
function fitxa(x) {
  const l = [];
  if (x.edat) l.push(`${esc(x.edat)} anys`);
  if (dataNecro(x.dataMort)) l.push(`Va morir el ${dataCa(dataNecro(x.dataMort))}`);
  if (x.vetlla) l.push(`Vetlla: ${textVetlla(x)}`);
  if (x.ceremonia) l.push(`Cerimònia: ${textCerimonia(x)}`);
  else if (dataNecro(x.dataFuneral)) l.push(`Funeral: ${dataCa(dataNecro(x.dataFuneral))}`);
  const det = x.detall || x.biografia || "";
  return `<article class="fitxa"><b>${esc(String(x.nom).toLocaleUpperCase("ca"))}</b>${l.length ? "<br>" + l.join("<br>") : ""}` +
    (det ? `<br>${esc(det)}` : "") + `</article>`;
}

function pinta() {
  const t = pla(document.getElementById("cerca").value.trim());
  const camp = document.getElementById("camp").value;
  const mun = document.getElementById("municipi").value;
  const mes = document.getElementById("mes").value;
  // Data de mort: només un dia, o de «Data de mort» a «Fins al» (si se n'omple només un, és aquell dia).
  let mDe = document.getElementById("mortDe").value, mFins = document.getElementById("mortFins").value;
  if (!mDe) mDe = mFins; if (!mFins) mFins = mDe;
  if (mDe > mFins) [mDe, mFins] = [mFins, mDe];
  const filtrat = !!(t || mun || mes || mDe);
  document.getElementById("netejar").hidden = !filtrat && camp === "tot";
  const llista = TOTES.filter(x =>
    (!t || pla(textCamp(x, camp)).includes(t)) &&
    (!mun || (mun === "-" ? !x.municipi : x.municipi === mun)) &&
    (!mes || diaNecro(x).startsWith(mes)) &&
    (!mDe || (m => !!m && m >= mDe && m <= mFins)(dataNecro(x.dataMort))));
  const pagines = Math.max(1, Math.ceil(llista.length / PER_PAGINA));
  PAGINA = Math.min(Math.max(1, PAGINA), pagines);
  const tros = llista.slice((PAGINA - 1) * PER_PAGINA, PAGINA * PER_PAGINA);
  const cos = document.getElementById("cos");
  if (!tros.length) cos.innerHTML = `<p class="buit">${filtrat ? "Cap necrològica coincideix amb la cerca i els filtres." : "Encara no hi ha cap necrològica recollida."}</p>`;
  else {
    // Agrupades per dia.
    const grups = [];
    tros.forEach(x => { const d = diaNecro(x); const g = grups[grups.length - 1]; if (g && g.d === d) g.l.push(x); else grups.push({ d, l: [x] }); });
    cos.innerHTML = grups.map(g => `<h2 class="dia">${g.d ? DIES[new Date(g.d + "T12:00:00").getDay()].replace(/^./, c => c.toUpperCase()) + " " + dataCa(g.d) : "Sense data"}</h2>` +
      `<div class="llista">${g.l.map(fitxa).join("")}</div>`).join("");
  }
  const p = document.getElementById("pagines");
  if (pagines < 2) { p.innerHTML = ""; return; }
  let h = `<button data-p="${PAGINA - 1}"${PAGINA === 1 ? " disabled" : ""}>← Més recents</button>`;
  for (let i = 1; i <= pagines; i++) {
    if (i === 1 || i === pagines || Math.abs(i - PAGINA) <= 2) h += `<button data-p="${i}" class="${i === PAGINA ? "actiu" : ""}">${i}</button>`;
    else if (Math.abs(i - PAGINA) === 3) h += `<span>…</span>`;
  }
  h += `<button data-p="${PAGINA + 1}"${PAGINA === pagines ? " disabled" : ""}>Més antigues →</button>`;
  p.innerHTML = h;
  p.querySelectorAll("button[data-p]").forEach(b => b.onclick = () => {
    PAGINA = Number(b.dataset.p);
    const u = new URL(location.href); u.searchParams.set("p", PAGINA); history.replaceState(null, "", u);
    pinta(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
}

(async () => {
  PAGINA = Number(new URLSearchParams(location.search).get("p")) || 1;
  try {
    const r = await fetch("../dades/necrologiques.json?v=" + Date.now());
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    TOTES = (d.llista || []).filter(x => x && x.nom).map(x => ({ ...x, municipi: municipi(x) })).sort((a, b) => diaNecro(b).localeCompare(diaNecro(a)) || a.nom.localeCompare(b.nom, "ca"));
    const q = d.actualitzat ? new Date(d.actualitzat) : null, z = n => String(n).padStart(2, "0");
    document.getElementById("sub").textContent = `${TOTES.length} necrològiques` +
      (q ? ` · Actualitzat el ${z(q.getDate())}.${z(q.getMonth() + 1)}.${q.getFullYear()} a les ${z(q.getHours())}.${z(q.getMinutes())} h` : "");
  } catch (e) {
    document.getElementById("sub").textContent = "Encara no s'han recollit les necrològiques.";
  }
  omplirFiltres();
  const torna = () => { PAGINA = 1; pinta(); };
  document.getElementById("cerca").oninput = torna;
  ["camp", "municipi", "mes", "mortDe", "mortFins"].forEach(id => document.getElementById(id).onchange = torna);
  ["mortDe", "mortFins"].forEach(id => document.getElementById(id).oninput = torna);
  document.getElementById("netejar").onclick = () => {
    document.getElementById("cerca").value = "";
    ["camp", "municipi", "mes"].forEach(id => document.getElementById(id).selectedIndex = 0);
    ["mortDe", "mortFins"].forEach(id => document.getElementById(id).value = "");
    torna();
  };
  pinta();
})();
</script>
<script src="../dates-ca.js?v=3"></script>
</body>
</html>
