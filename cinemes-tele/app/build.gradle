plugins {
    id 'com.android.application'
}

// El token de lectura de TMDB, només a local.properties (fora de qualsevol repositori)
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def tmdbToken = localProps.getProperty('tmdb.token', '')

android {
    namespace 'cat.latdg.temps'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'cat.latdg.temps'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'TMDB_TOKEN', '"' + tmdbToken + '"'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Instal·lat per ADB, com el launcher: signat amb la clau de depuració.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
